<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Scientific Notation | Skill Builder</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#25312f;font:16px/1.5 system-ui,sans-serif}main{max-width:700px;margin:auto;padding:28px 24px}.prompt{margin:0 0 16px;color:#58645f;font-size:15px}.math{font-size:30px;overflow-x:auto;padding:12px 0 24px;min-height:80px}math{font-size:1em}form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,button{font:inherit;border:1px solid #b7c0ba;border-radius:5px;padding:9px 12px}input{width:270px;max-width:100%;min-width:0}button{cursor:pointer;background:#f5f7f5;color:#263a30}button[type=submit]{background:#285b45;color:white;border-color:#285b45}button:hover{filter:brightness(.95)}:focus-visible{outline:3px solid #b87f20;outline-offset:2px}.hint{font-size:13px;color:#58645f;margin-top:12px}.feedback{font-size:15px;margin-top:18px;min-height:48px}.good{color:#20623e}.bad{color:#a23e26}.close{color:#875c0b}@media(max-width:480px){main{padding:22px 16px}input{width:100%}button{font-size:14px}.math{font-size:26px}}
.answer-row{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:18px;align-items:center;width:100%}.preview{min-height:48px;overflow-x:auto;padding:8px 0;font-size:23px}.preview.empty{font:13px/1.5 system-ui,sans-serif;color:#68736d}.preview-label{font:12px/1.5 system-ui,sans-serif;color:#68736d;display:block}.answer-row input{width:100%}@media(max-width:480px){.answer-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.preview{font-size:19px}}
.solution{margin-top:18px;padding:16px;background:#f5f7f5;border-radius:5px}.solution[hidden]{display:none}.solution-answer{font-size:24px;overflow-x:auto;margin-bottom:10px}.solution p{margin:0;font-size:15px}
h1{font-size:24px;font-weight:650;margin:0 0 20px}.actions{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-top:8px}.step-heading{display:block;margin:16px 0 8px}.step-heading:first-child{margin-top:0}.solution-answer{padding:10px 0;line-height:normal;overflow-y:hidden}.solution-answer .katex,.preview .katex{display:inline-block;vertical-align:middle}.preview{min-height:56px;padding:12px 0;line-height:normal;overflow-y:hidden}

/* Shared Skill Builder presentation, kept inline so each activity remains standalone. */
main{max-width:700px;margin:auto;padding:28px 24px}
h1{font-size:24px;font-weight:650;line-height:1.3;margin:0 0 20px}
h2{font-size:19px;font-weight:650;margin:0 0 12px}
.back-link{display:inline-block;margin:0 0 18px;color:#285b45;font-size:14px;text-decoration:none}
.back-link:hover{text-decoration:underline}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{width:270px;max-width:100%;padding:9px 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-top:8px}
button{font:inherit;padding:9px 12px;border:1px solid #b7c0ba;border-radius:5px;background:#f5f7f5;color:#263a30}
button[type=submit]{background:#285b45;border-color:#285b45;color:#fff}
:focus-visible{outline:3px solid #b87f20;outline-offset:2px}
.feedback{font-size:15px;min-height:24px;margin-top:16px}
.feedback:not(:empty){padding:10px 12px;border-radius:5px;border-left:3px solid currentColor}
.feedback.good{color:#20623e;background:#edf6ef}.feedback.bad{color:#a23e26;background:#fff3ee}
.feedback.close{color:#875c0b;background:#fff8e7}.feedback.input{color:#405d79;background:#eef3f8}
.solution{margin-top:18px;padding:16px;background:#f5f7f5;border-radius:5px}
.solution[hidden]{display:none}
.rule-heading,.final-heading,.step-heading,.final-label{display:block;font-size:15px;font-weight:700;margin:16px 0 8px}
.rule-heading:first-child,.step-heading:first-child{margin-top:0}
.solution-answer,.step-maths{padding:10px 0;font-size:23px;line-height:normal;overflow-x:auto;overflow-y:hidden}
.solution-answer .katex,.step-maths .katex,.preview .katex{display:inline-block;vertical-align:middle}
.preview{min-height:56px;padding:12px 0;font-size:23px;line-height:normal;overflow-x:auto;overflow-y:hidden}
.preview.empty{font:13px/1.5 system-ui,sans-serif;color:#68736d}
.preview-label{display:block;font-size:12px;color:#68736d}
@media(max-width:480px){main{padding:22px 16px}button{font-size:14px}.preview{font-size:19px}.answer-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.answer-row input{width:100%}}
</style>
</head>
<body>
<main aria-label="Scientific notation practice"><a class="back-link" href="index.html">← Skill Builder</a>
<h1>Scientific Notation</h1>
<p id="prompt" class="prompt"></p>
<div id="question" class="math"></div>
<form id="form"><div class="answer-row"><input id="answer" aria-label="Your answer" aria-describedby="hint feedback" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer"><div><span class="preview-label">Preview</span><div id="preview" class="preview empty" aria-live="polite" aria-label="Answer preview">Your formatted answer</div></div></div><div class="actions"><button type="submit">Check Answer</button><button type="button" id="next">New Question</button><button type="button" id="show-solution" aria-controls="solution" aria-expanded="false">Show Solution</button></div></form>
<p id="hint" class="hint"></p>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<div id="solution" class="solution" hidden><strong class="step-heading">Convert the number</strong><p id="solution-working"></p><div id="solution-equation" class="solution-answer"></div><strong class="step-heading">Final answer:&#160;&#160;&#160;</strong><div id="solution-answer" class="solution-answer"></div></div>
</main>
<script>
'use strict';

function displayFeedback(target,kind,text){
  const prefixes={bad:'Not quite. ',close:'You’re close! ',input:'Check your input. '};
  const prefix=prefixes[kind];
  if(prefix&&!text.startsWith(prefix.trim()))text=prefix+text;
  target.textContent=text;
  target.className='feedback '+kind;
}
function checkExpressionInput(source){
  if(!source.trim())throw Error('Enter your answer before checking it.');
  if(source.length>180)throw Error('Keep your answer to 180 characters or fewer.');
  const s=source.replace(/\s/g,'');
  let depth=0;
  for(const character of s){if(character==='(')depth++;if(character===')')depth--;if(depth<0)throw Error('There is a closing bracket without an opening bracket. Check your brackets.');}
  if(/\/(?:\()?$/g.test(s))throw Error('The fraction is missing its denominator. Enter a number or expression after /, using brackets around a multi-term denominator.');
  if(/\^(?:\(?[+-]?)?$/.test(s))throw Error('The power is missing its exponent. Enter an integer after ^, for example x^3.');
  if(depth!==0)throw Error('An opening bracket is missing its closing bracket. Put the whole denominator inside matching brackets when entering a fraction.');
  if(/\*\*|\/\/|\^\^/.test(s))throw Error('Check the repeated operation signs. Use one * for multiplication, / for a fraction, or ^ for a power.');
}

const randomInt=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
// A decimal is represented exactly as integer digits times a power of ten.
// No floating-point tolerance is used to mark very small numbers.
function decimal(text){
  if(!/^\d+(?:\.\d+)?$/.test(text))throw Error('Enter a positive number using digits and a decimal point, or scientific notation such as 3.2*10^6.');
  const parts=text.split('.');let digits=(parts[0]+(parts[1]||'')).replace(/^0+/,'')||'0',exponent=-(parts[1]||'').length;
  if(digits==='0')return {digits:'0',exponent:0};
  while(digits.endsWith('0')){digits=digits.slice(0,-1);exponent++;}
  return {digits,exponent};
}
function same(a,b){return a.digits===b.digits&&a.exponent===b.exponent;}
function ordinary(digits,exponent){
  const point=digits.length+exponent;
  return point<=0?'0.'+'0'.repeat(-point)+digits:point>=digits.length?digits+'0'.repeat(point-digits.length):digits.slice(0,point)+'.'+digits.slice(point);
}
function withCommas(text){
  const [integer,fraction]=text.split('.');
  return integer.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(fraction===undefined?'':'.'+fraction);
}
let typeBag=[],precisionBag=[];
function shuffled(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=randomInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function nextType(){if(!typeBag.length)typeBag=shuffled([0,1,2,3]);return typeBag.pop();}
function nextPrecision(){if(!precisionBag.length)precisionBag=shuffled([0,1,2]);return precisionBag.pop();}
function generateQuestion(type=nextType()){
  const small=type>=2,toScientific=type%2===0;
  const places=nextPrecision();
  let digits=String(randomInt(1,9))+(places===1?String(randomInt(1,9)):places===2?String(randomInt(0,9))+String(randomInt(1,9)):'');
  const coefficient=digits[0]+(digits.length>1?'.'+digits.slice(1):'');
  const power=small?-randomInt(2,9):randomInt(2,9);
  const value=decimal(coefficient);value.exponent+=power;
  return {type,toScientific,small,coefficient,power,value,standard:ordinary(value.digits,value.exponent)};
}
function parseAnswer(text){
  if(!text.trim())throw Error('Enter your answer before checking it.');
  if(text.length>160)throw Error('Keep your answer to 160 characters or fewer.');
  let s=text.trim().replace(/[−–]/g,'-').replace(/\s+/g,'');
  if(/[xXeE×·]/.test(s))throw Error('Use * for multiplication and ^ for the power, for example 3.2*10^6.');
  const powers={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':'+'};
  s=s.replace(/10([⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+)/g,(_,p)=>'10^'+[...p].map(c=>powers[c]).join(''));
  if(/^10\^/.test(s))throw Error('Scientific notation should start with a number between 1 and 10 multiplied by a power of 10. Include the number at the front, for example 1*10^7.');
  if(/^[+-]?\d+(?:\.\d+)?\*10(?:\^(?:\(?[+-]?)?)?$/.test(s))throw Error('The power of ten is missing its exponent. Type ^ followed by an integer exponent after 10, for example 3.2*10^6.');
  const sci=s.match(/^([+-]?\d+(?:\.\d+)?)[*]10\^(.+)$/);
  if(sci){
    let exponent=sci[2];
    if(exponent.startsWith('(')&&exponent.endsWith(')'))exponent=exponent.slice(1,-1);
    else if(/[()]/.test(exponent))throw Error('Check the exponent brackets.');
    if(!/^[+-]?\d+$/.test(exponent))throw Error('The exponent should be an integer.');
    const power=Number(exponent);
    if(Math.abs(power)>9)throw Error('Use an integer exponent between -9 and 9.');
    if(Number(sci[1])<0)throw Error('The number at the front must be between one and ten.');
    const coefficient=decimal(sci[1].replace(/^\+/,''));
    const value={digits:coefficient.digits,exponent:coefficient.exponent+power};
    return {value,coefficient,power,scientific:true,normalised:coefficient.digits!=='0'&&coefficient.digits.length+coefficient.exponent===1};
  }
  if(s.includes(',')){
    if(!/^\d{1,3}(?:,\d{3})+(?:\.\d+)?$/.test(s))throw Error('Use commas only to group thousands, or leave them out.');
    s=s.replace(/,/g,'');
  }
  return {value:decimal(s),scientific:false};
}
function assessAnswer(question,text){
  const answer=parseAnswer(text),equal=same(question.value,answer.value);
  if(question.toScientific&&answer.scientific&&!answer.normalised)return {kind:equal?'close':'bad',text:'The number at the front must be between one and ten.'};
  if(!equal){
    if(question.toScientific&&answer.scientific){
      const coefficientCorrect=same(decimal(question.coefficient),answer.coefficient),powerCorrect=answer.power===question.power;
      if(coefficientCorrect&&answer.power===-question.power)return {kind:'bad',text:'Not quite. Check the sign of your exponent. Large numbers have a positive power; very small numbers have a negative power.'};
      if(!coefficientCorrect&&powerCorrect)return {kind:'bad',text:'Not quite. Check the number at the front. Move the decimal point to make a number between 1 and 10, keeping the original digits.'};
      if(coefficientCorrect&&!powerCorrect)return {kind:'bad',text:'Not quite. Check your exponent. Count how many places the decimal point moves.'};
      return {kind:'bad',text:'Not quite. Check both the number at the front and the exponent. Keep the original digits and count how many places the decimal point moves.'};
    }
    if(question.toScientific)return {kind:'bad',text:'Check your answer and write it in scientific notation, using *10^ followed by an integer exponent.'};
    if(answer.value.digits===question.value.digits)return {kind:'bad',text:'Not quite. The digits are correct, but check the decimal point position. A positive exponent moves it right; a negative exponent moves it left.'};
    return {kind:'bad',text:'Not quite. Check the digits and the decimal point position. Keep the original digits and move the decimal point the number of places shown by the exponent.'};
  }
  if(question.toScientific&&!answer.scientific)return {kind:'close',text:'You’re close! The value is correct, but write it in scientific notation: a number between 1 and 10, multiplied by a power of ten.'};
  if(!question.toScientific&&answer.scientific)return {kind:'close',text:'You’re close! The value is correct, but write it as an ordinary number without a power of ten.'};
  return {kind:'good',text:'Correct!'};
}
const $=id=>document.getElementById(id);

function previewExpression(text){
  const bare=text.replace(/\s/g,'').replace(/[−–]/g,'-').match(/^10\^\(?([+-]?\d+)\)?$/);
  if(bare&&Math.abs(Number(bare[1]))<=9){
    return {latex:'10^{'+bare[1]+'}',mathml:'<msup><mn>10</mn><mn>'+bare[1]+'</mn></msup>'};
  }
  parseAnswer(text); // Use the marking grammar, without checking correctness.
  const s=text.replace(/\s/g,'').replace(/[−–]/g,'-');
  const match=s.match(/^(\d+(?:\.\d+)?)\*10(?:\^\(?([+-]?\d+)\)?|([⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+))$/);
  if(match){
    const map={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':'+'};
    const power=match[2]??[...match[3]].map(c=>map[c]).join('');
    return {latex:match[1]+' \\times 10^{'+power+'}',mathml:`<mrow><mn>${match[1]}</mn><mo>×</mo><msup><mn>10</mn><mn>${power}</mn></msup></mrow>`};
  }
  return {latex:s.replace(/,/g,'{,}'),mathml:`<mn>${s}</mn>`};
}
function updatePreview(){
  const target=$('preview'),text=$('answer').value;
  target.className='preview';
  if(!text.trim()){target.textContent='Your formatted answer';target.className+=' empty';return;}
  try{
    const expression=previewExpression(text);
    if(window.katex)window.katex.render(expression.latex,target,{throwOnError:false,output:'htmlAndMathml'});
    else target.innerHTML='<math xmlns="http://www.w3.org/1998/Math/MathML">'+expression.mathml+'</math>';
  }catch(error){target.textContent=error.message.includes('missing its exponent')?'Add ^ and an integer exponent after 10.':/[xXeE×·]/.test(text)?'Use * for multiplication.':'Keep typing a number or a form like 3.2*10^6.';target.className+=' empty';}
}

let current;
function newQuestion(){
  current=generateQuestion();
  $('prompt').textContent=current.toScientific?'Write this number in scientific notation.':'Write this number in standard form.';
  if(current.toScientific){$('question').textContent=withCommas(current.standard);}
  else{
    // Native MathML gives mathematical typesetting without an external library.
    $('question').innerHTML=`<math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mn>${current.coefficient}</mn><mo>×</mo><msup><mn>10</mn><mn>${current.power}</mn></msup></mrow></math>`;
  }
  $('hint').textContent=current.toScientific?'Use * for multiplication and ^ for powers. For example: 3.2*10^6.':'Enter the full number using a decimal point if needed.';
  $('solution').hidden=true;$('show-solution').setAttribute('aria-expanded','false');
  $('solution-answer').textContent='';$('solution-working').textContent='';$('solution-equation').textContent='';
  $('answer').value='';updatePreview();$('feedback').textContent='';$('feedback').className='feedback';
}
$('form').addEventListener('submit',event=>{
  event.preventDefault();
  try{const verdict=assessAnswer(current,$('answer').value);displayFeedback($('feedback'),verdict.kind,verdict.text);}
  catch(error){displayFeedback($('feedback'),'input',error.message);}
});

function solutionFor(question){
  const steps=Math.abs(question.power),places=steps===1?'place':'places';
  let explanation;
  if(question.toScientific){
    const direction=question.small?'right':'left';
    explanation=`Move the decimal point ${steps} ${places} to the ${direction} to get ${question.coefficient}, which is a number between 1 and 10. ${question.small?'Very small numbers have a negative exponent':'Large numbers have a positive exponent'}, so the exponent is ${question.power}.`;
  }else{
    explanation=`Move the decimal point ${steps} ${places} to the ${question.small?'left':'right'}.`;
  }
  if(question.power===0)explanation=question.toScientific?`The number is already a number between 1 and 10, so the exponent is 0.`:'The exponent is 0, so the decimal point stays in the same place.';
  return {answer:question.toScientific?`${question.coefficient}*10^${question.power}`:withCommas(question.standard),explanation};
}
function renderFormatted(target,expression){
  if(window.katex)window.katex.render(expression.latex,target,{throwOnError:false,output:'htmlAndMathml'});
  else target.innerHTML='<math xmlns="http://www.w3.org/1998/Math/MathML">'+expression.mathml+'</math>';
}
function showSolution(){
  const solution=solutionFor(current),answer=previewExpression(solution.answer);
  const standard=previewExpression(withCommas(current.standard)),scientific=previewExpression(current.coefficient+'*10^'+current.power);
  const left=current.toScientific?standard:scientific,right=current.toScientific?scientific:standard;
  renderFormatted($('solution-equation'),{latex:left.latex+' = '+right.latex,mathml:'<mrow>'+left.mathml+'<mo>=</mo>'+right.mathml+'</mrow>'});
  renderFormatted($('solution-answer'),answer);
  $('solution-working').textContent=solution.explanation;
  $('solution').hidden=false;$('show-solution').setAttribute('aria-expanded','true');
}

$('show-solution').addEventListener('click',showSolution);
$('answer').addEventListener('input',updatePreview);
$('next').addEventListener('click',()=>{newQuestion();$('answer').focus();});
newQuestion();
</script>
</body>
</html>
