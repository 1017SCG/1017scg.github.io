/* Shared Skill Builder presentation, kept inline so each activity remains standalone. */

<body><main aria-label="Change of base practice"><a class="back-link" href="index.html">← Skill Builder</a>
<h1>Change of Base Rule for Logarithms</h1>
<p class="prompt" id="prompt"></p>
<div id="question" class="math"></div>
<form id="form"><input id="answer" aria-label="Your answer" aria-describedby="feedback" autocomplete="off" placeholder="Your answer"><div class="actions"><button type="submit">Check Answer</button><button type="button" id="next">New Question</button><button type="button" id="show-solution" aria-controls="solution" aria-expanded="false">Show Solution</button></div></form>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<div id="solution" class="solution" hidden></div>

</main><script>
'use strict';
const byId = id => document.getElementById(id);
const bases = [2,3,4,5,6,7,8,9,10,'e'];
const log = (base, argument) => '\\log_{'+base+'}('+argument+')';
const choose = items => items[Math.floor(Math.random()*items.length)];
const candidates = new Map(bases.map(base => {
  const integerPowers = new Set();
  if (base !== 'e') {
    for (let power = base; power <= 100; power *= base) integerPowers.add(power);
  }
  const argumentsForBase = Array.from({length:99}, (_,index) => index+2);
  return [base,argumentsForBase.filter(argument => !integerPowers.has(argument))];
}));
let current;

function generateQuestion(previous) {
  const base = choose(bases);
  const argument = choose(candidates.get(base).filter(value => base !== previous?.base || value !== previous.argument));
  const places = choose([2,3,4]);
  const value = Math.log(argument)/Math.log(base === 'e' ? Math.E : base);
  return {base,argument,places,answer:value.toFixed(places)};
}

function render(target,latex,fallback) {
  if (window.katex) window.katex.render(latex,target,{throwOnError:false});
  else target.textContent = fallback;
}

function assess(input,{places,answer}) {
  const match = input.trim().match(/^\+?(?:\d+|\d*\.(\d+))$/);
  if (!match) return ['input','Enter your answer as a decimal.'];
  if (Number(input) === Number(answer)) {
    if (match[1]?.length !== places) return ['close','You have the right value. Write it to '+places+' decimal places, including any trailing zeros.'];
    return ['good','Correct!'];
  }
  const difference = Math.abs(Number(input) - Number(answer));
  const tolerance = 2 / 10**places;
  if (difference <= tolerance + 8*Number.EPSILON) {
    return ['close','You’re close! Check your rounding to '+places+' decimal places.'];
  }
  return ['bad','Not quite. Use the change of base rule.'];
}

function newQuestion() {
  current = generateQuestion(current);
  const {base,argument,places} = current;
  byId('prompt').textContent = 'Use your scientific calculator to evaluate. Round to '+places+' decimal places.';
  render(byId('question'),log(base,argument),'log_'+base+'('+argument+')');
  byId('answer').value = '';
  byId('feedback').textContent = '';
  byId('solution').hidden = true;
  byId('show-solution').setAttribute('aria-expanded','false');
}

function showSolution() {
  const {base,argument,places,answer} = current;
  const target = byId('solution');
  const button = base === 10 ? 'log' : base === 'e' ? 'ln' : null;
  target.innerHTML = (button ? '' : '<strong class="step-heading">Use the change of base rule</strong><div class="step-maths" id="base-rule"></div>'+
    '<strong class="step-heading">Change to base 10</strong><p>Substitute the argument (the number in the brackets) and the original base.</p><div class="step-maths" id="base-substitution"></div>')+
    '<strong class="step-heading">Calculate and round</strong><p id="calculator-entry"></p>'+
    '<strong class="final-heading">Final answer</strong><div class="step-maths" id="base-result"></div>';
  if (!button) {
    render(byId('base-rule'),log('b','N')+'=\\frac{'+log('a','N')+'}{'+log('a','b')+'}',
      'log_b(N) = log_a(N) / log_a(b)');
    render(byId('base-substitution'),log(base,argument)+'=\\frac{'+log(10,argument)+'}{'+log(10,base)+'}',
      'log_'+base+'('+argument+') = log_10('+argument+') / log_10('+base+')');
  }
  const instruction = button ? 'Use the '+button+' button to evaluate '+button+'('+argument+').' :
    'Enter log('+argument+') ÷ log('+base+') on your calculator.';
  byId('calculator-entry').textContent = instruction+' Round to '+places+' decimal places.';
  render(byId('base-result'),log(base,argument)+'\\approx '+answer, 'log_'+base+'('+argument+') ≈ '+answer);
  target.hidden = false;
  byId('show-solution').setAttribute('aria-expanded','true');
}

document.addEventListener('DOMContentLoaded', () => {
  byId('answer').inputMode = 'decimal';
  byId('form').addEventListener('submit',event => {
    event.preventDefault();
    const [kind,message] = assess(byId('answer').value,current);
    byId('feedback').className = 'feedback '+kind;
    byId('feedback').textContent = message;
  });
  byId('next').addEventListener('click',() => { newQuestion(); byId('answer').focus(); });
  byId('show-solution').addEventListener('click',showSolution);
  newQuestion();
});
</script>
