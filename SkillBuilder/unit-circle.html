<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Circle | Skill Builder</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#25312f;font:16px/1.5 system-ui,sans-serif}main{max-width:700px;margin:auto;padding:28px 24px}.prompt{margin:0 0 16px;color:#58645f;font-size:15px}.math{font-size:30px;overflow-x:auto;padding:12px 0 24px;min-height:80px}math{font-size:1em}form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,button{font:inherit;border:1px solid #b7c0ba;border-radius:5px;padding:9px 12px}input{width:270px;max-width:100%;min-width:0}button{cursor:pointer;background:#f5f7f5;color:#263a30}button[type=submit]{background:#285b45;color:white;border-color:#285b45}button:hover{filter:brightness(.95)}:focus-visible{outline:3px solid #b87f20;outline-offset:2px}.hint{font-size:13px;color:#58645f;margin-top:12px}.feedback{font-size:15px;margin-top:18px;min-height:48px}.good{color:#20623e}.bad{color:#a23e26}.close{color:#875c0b}@media(max-width:480px){main{padding:22px 16px}input{width:100%}button{font-size:14px}.math{font-size:26px}}
.solution{margin-top:18px;padding:16px;background:#f5f7f5;border-radius:5px}.solution[hidden]{display:none}.solution-answer{font-size:24px;overflow-x:auto;margin-bottom:10px}.solution p{margin:0;font-size:15px}
.step{margin:18px 0}.step p{margin:0 0 6px;font-size:14px}.step-maths{font-size:23px;overflow-x:auto;overflow-y:hidden;padding:12px 0;line-height:normal}.step-maths .katex{display:inline-block;vertical-align:middle}.rule{font-size:14px;margin-bottom:16px!important}.final-label{display:block;margin-top:20px}#answer{width:200px}
h1{font-size:24px;font-weight:650;margin:0 0 20px}.actions{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-top:8px}

/* Shared Skill Builder presentation, kept inline so each activity remains standalone. */
main{max-width:700px;margin:auto;padding:28px 24px}
h1{font-size:24px;font-weight:650;line-height:1.3;margin:0 0 20px}
h2{font-size:19px;font-weight:650;margin:0 0 12px}
.back-link{display:inline-block;margin:0 0 18px;color:#285b45;font-size:14px;text-decoration:none}
.back-link:hover{text-decoration:underline}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{width:270px;max-width:100%;padding:9px 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-top:8px}
button{font:inherit;padding:9px 12px;border:1px solid #b7c0ba;border-radius:5px;background:#f5f7f5;color:#263a30}
button[type=submit]{background:#285b45;border-color:#285b45;color:#fff}
:focus-visible{outline:3px solid #b87f20;outline-offset:2px}
.feedback{font-size:15px;min-height:24px;margin-top:16px}
.feedback:not(:empty){padding:10px 12px;border-radius:5px;border-left:3px solid currentColor}
.feedback.good{color:#20623e;background:#edf6ef}.feedback.bad{color:#a23e26;background:#fff3ee}
.feedback.close{color:#875c0b;background:#fff8e7}.feedback.input{color:#405d79;background:#eef3f8}
.solution{margin-top:18px;padding:16px;background:#f5f7f5;border-radius:5px}
.solution[hidden]{display:none}
.rule-heading,.final-heading,.step-heading,.final-label{display:block;font-size:15px;font-weight:700;margin:16px 0 8px}
.rule-heading:first-child,.step-heading:first-child{margin-top:0}
.solution-answer,.step-maths{padding:10px 0;font-size:23px;line-height:normal;overflow-x:auto;overflow-y:hidden}
.solution-answer .katex,.step-maths .katex,.preview .katex{display:inline-block;vertical-align:middle}
.preview{min-height:56px;padding:12px 0;font-size:23px;line-height:normal;overflow-x:auto;overflow-y:hidden}
.preview.empty{font:13px/1.5 system-ui,sans-serif;color:#68736d}
.preview-label{display:block;font-size:12px;color:#68736d}
@media(max-width:480px){main{padding:22px 16px}button{font-size:14px}.preview{font-size:19px}.answer-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.answer-row input{width:100%}}

.unit-circle{display:block;width:220px;max-width:100%;height:auto;margin:12px 0}
</style>
</head>
<body><main aria-label="Unit circle practice"><a class="back-link" href="index.html">← Skill Builder</a>
<h1>Unit Circle</h1>
<p class="prompt">Find the exact value using the unit circle. If the value does not exist, enter “undefined”.</p>
<div id="question" class="math"></div>
<form id="form">
  <input id="answer" aria-label="Your answer" aria-describedby="feedback" autocomplete="off" placeholder="Your answer">
  <div class="actions">
    <button type="submit">Check Answer</button>
    <button type="button" id="next">New Question</button>
    <button type="button" id="show-solution" aria-controls="solution" aria-expanded="false">Show Solution</button>
  </div>
</form>
<div id="feedback" class="feedback" role="status"></div>
<div id="solution" class="solution" hidden></div>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const angles = [
  {degrees: 0, radians: '0', plainRadians: '0', x: 1, y: 0},
  {degrees: 90, radians: '\\frac{\\pi}{2}', plainRadians: 'π/2', x: 0, y: 1},
  {degrees: 180, radians: '\\pi', plainRadians: 'π', x: -1, y: 0},
  {degrees: 270, radians: '\\frac{3\\pi}{2}', plainRadians: '3π/2', x: 0, y: -1},
  {degrees: 360, radians: '2\\pi', plainRadians: '2π', x: 1, y: 0}
];
const questions = angles.flatMap(angle => ['sin', 'cos', 'tan'].flatMap(fn => [false, true].map(inRadians => ({
  ...angle, fn, inRadians,
  expected: fn === 'sin' ? angle.y : fn === 'cos' ? angle.x : angle.x === 0 ? null : 0
}))));
let bag = [];
let current;

function newQuestion(focus = true) {
  if (!bag.length) {
    bag = [...questions];
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    if (bag.at(-1) === current) [bag[0], bag[bag.length - 1]] = [bag.at(-1), bag[0]];
  }
  current = bag.pop();
  const {fn, degrees, radians, plainRadians, inRadians} = current;
  const angleTex = inRadians ? radians : degrees + '^{\\circ}';
  const angleText = inRadians ? plainRadians : degrees + '°';
  render(byId('question'), '\\' + fn + '\\left(' + angleTex + '\\right)', fn + '(' + angleText + ')');
  byId('answer').value = '';
  byId('feedback').textContent = '';
  byId('solution').hidden = true;
  byId('show-solution').setAttribute('aria-expanded', 'false');
  if (focus) byId('answer').focus();
}

function render(target, latex, fallback) {
  if (window.katex) window.katex.render(latex, target, {throwOnError: false});
  else target.textContent = fallback;
}

function assessAnswer(q, text) {
  const input = text.trim().toLowerCase().replace(/^−/, '-');
  const undefinedAnswer = input === 'undefined';
  if (!undefinedAnswer && !/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(input)) {
    return ['input', 'Enter a number, or type “undefined” if the value does not exist.'];
  }
  if (undefinedAnswer ? q.expected === null : q.expected !== null && Number(input) === q.expected) {
    return ['good', 'Correct!'];
  }
  const hint = {sin: 'Use the y-coordinate of the point on the unit circle.', cos: 'Use the x-coordinate of the point on the unit circle.', tan: 'Divide the y-coordinate by the x-coordinate. Check whether the denominator is zero.'};
  return ['bad', 'Not quite. ' + hint[q.fn]];
}

function showSolution() {
  const {fn, x, y, expected} = current;
  const answer = expected === null ? 'undefined' : String(expected);
  const coordinate = {sin: 'y', cos: 'x'}[fn];
  const ratio = fn === 'sin' ? 'y = ' + y : fn === 'cos' ? 'x = ' + x : '\\frac{y}{x} = \\frac{' + y + '}{' + x + '} = ' + (expected === null ? '\\text{undefined}' : answer);
  const plainRatio = fn === 'tan' ? 'y/x = ' + y + '/' + x + ' = ' + answer : ratio;
  const target = byId('solution');
  target.innerHTML = `
    <strong class="step-heading">Find the point on the unit circle</strong>
    <p>The point on the unit circle is (${x}, ${y}).</p>
    <svg class="unit-circle" viewBox="0 0 220 220" role="img" aria-label="Unit circle with the point (${x}, ${y}) highlighted">
      <circle cx="110" cy="110" r="76" fill="none" stroke="#58645f"/>
      <path d="M15 110H205 M110 205V15" stroke="#58645f"/>
      <text x="206" y="105" fill="#25312f">x</text><text x="117" y="18" fill="#25312f">y</text>
      <line x1="110" y1="110" x2="${110 + 76*x}" y2="${110 - 76*y}" stroke="#24558c" stroke-width="3"/>
      <circle cx="${110 + 76*x}" cy="${110 - 76*y}" r="5" fill="#24558c"/>
    </svg>
    <strong class="step-heading">Evaluate ${fn}</strong>
    ${coordinate ? `<p>As we are finding ${fn}, we want the ${coordinate}-coordinate.</p>` : ''}
    <div id="working" class="step-maths"></div>
    ${expected === null ? '<p>Division by zero is undefined.</p>' : ''}
    <strong class="final-heading">Final answer:</strong>
    <div class="solution-answer">${answer}</div>`;
  render(byId('working'), ratio, plainRatio);
  target.hidden = false;
  byId('show-solution').setAttribute('aria-expanded', 'true');
}

document.addEventListener('DOMContentLoaded', () => {
  byId('form').addEventListener('submit', event => {
    event.preventDefault();
    const [kind, message] = assessAnswer(current, byId('answer').value);
    byId('feedback').className = 'feedback ' + kind;
    byId('feedback').textContent = message;
  });
  byId('next').addEventListener('click', () => newQuestion());
  byId('show-solution').addEventListener('click', showSolution);
  newQuestion(false);
});
</script>
</body>
</html>
