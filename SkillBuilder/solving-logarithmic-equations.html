<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solving Logarithmic Equations | Skill Builder</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js" crossorigin="anonymous"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:white;color:#25312f;font:16px/1.5 system-ui,sans-serif}
.prompt{margin:0 0 16px;color:#58645f;font-size:15px}
.terms{display:flex;align-items:center;gap:16px;padding:12px 0 24px;font-size:28px}
button{cursor:pointer}
button[type=submit]{background:#285b45;border-color:#285b45;color:white}
button:hover{filter:brightness(.95)}
.solution p{margin:8px 0 0;padding:5px 0;line-height:1.8;overflow-x:auto;overflow-y:hidden}
.final-heading{display:block;font-size:15px;margin:16px 0 8px}
@media(max-width:480px){main{padding:22px 16px}button{font-size:14px}}
main{max-width:700px;margin:auto;padding:28px 24px}
h1{font-size:24px;font-weight:650;line-height:1.3;margin:0 0 20px}
.back-link{display:inline-block;margin:0 0 18px;color:#285b45;font-size:14px;text-decoration:none}
.back-link:hover{text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-top:8px}
button{font:inherit;padding:9px 12px;border:1px solid #b7c0ba;border-radius:5px;background:#f5f7f5;color:#263a30}
:focus-visible{outline:3px solid #b87f20;outline-offset:2px}
.feedback{font-size:15px;min-height:24px;margin-top:16px}
.feedback:not(:empty){padding:10px 12px;border-radius:5px;border-left:3px solid currentColor}
.feedback.good{color:#20623e;background:#edf6ef}.feedback.bad{color:#a23e26;background:#fff3ee}
.feedback.close{color:#875c0b;background:#fff8e7}.feedback.input{color:#405d79;background:#eef3f8}
.solution{margin-top:18px;padding:16px;background:#f5f7f5;border-radius:5px}
.solution[hidden]{display:none}
</style>
<style>
.answer-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input{font:inherit;width:270px;max-width:100%;border:1px solid #b7c0ba;border-radius:5px;padding:9px 12px}
</style>
</head>
<body>
<main>
  <a class="back-link" href="index.html">← Skill Builder</a>
  <h1>Solving Logarithmic Equations</h1>
  <p class="prompt" id="prompt">Solve for x. Round your answer to two decimal places if necessary.</p>
  <div id="question" class="terms"></div>
  <form id="form">
    <div class="answer-row">
      <input id="answer" aria-label="Your answer" autocomplete="off" placeholder="Your answer">
    </div>
    <div class="actions">
      <button type="submit">Check Answer</button>
      <button type="button" id="next">New Question</button>
      <button type="button" id="show-solution" aria-controls="solution" aria-expanded="false">Show Solution</button>
    </div>
  </form>
  <div id="feedback" class="feedback" role="status"></div>
  <div id="solution" class="solution" hidden></div>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const bases = [2,3,4,5,6,7,8,9,10,'e'];
const randomInt = (min,max) => min + Math.floor(Math.random()*(max-min+1));
let current;

function generateQuestion() {
  const base = bases[randomInt(0,bases.length-1)];
  const a = randomInt(1,5);
  const c = randomInt(1,4);
  const d = randomInt(-a,2*a);
  const power = (base === 'e' ? Math.E : base)**(d/a);
  const exact = power/c;
  const answer = Number(exact.toFixed(2));
  const argument = (c === 1 ? '' : c)+'x';
  const prefix = a === 1 ? '' : String(a);
  const logarithm = '\\log_{'+base+'}('+argument+')';
  return {base,a,c,d,answer,exact,argument,logarithm,
    equation:prefix+logarithm+'='+d, plain:prefix+'log_'+base+'('+argument+') = '+d};
}

function render(target,latex,plain) {
  if (window.katex) window.katex.render(latex,target,{throwOnError:false});
  else target.textContent = plain;
}

function assess(text,answer) {
  const input = text.trim().replace(/^x\s*=\s*/i,'').trim();
  if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(input)) {
    return ['input','Enter your answer as a number.'];
  }
  const value = Number(input);
  if (value <= 0) return ['bad','The number inside the logarithm must be positive. Check your answer.'];
  const difference = Math.abs(value-answer);
  if (difference <= 0.02 + Number.EPSILON*Math.max(1,Math.abs(answer))) return ['good','Correct!'];
  return ['bad','Not quite. Isolate the logarithm first, then rewrite the equation in exponential form.'];
}

function newQuestion() {
  let next = generateQuestion();
  while (next.equation === current?.equation) next = generateQuestion();
  current = next;
  render(byId('question'),current.equation,current.plain);
  byId('answer').value = '';
  byId('feedback').textContent = '';
  byId('solution').hidden = true;
  byId('show-solution').setAttribute('aria-expanded','false');
}

function showSolution() {
  const {a,c,d,base,answer,exact,argument,logarithm} = current;
  const target = byId('solution');
  target.replaceChildren();
  function step(title,latex,plain) {
    const heading = document.createElement('strong');
    heading.className = 'final-heading';
    heading.textContent = title;
    const line = document.createElement('p');
    render(line,latex,plain);
    target.append(heading,line);
  }
  const exponent = a === 1 ? String(d) : '\\frac{'+d+'}{'+a+'}';
  const plainExponent = a === 1 ? String(d) : d+'/'+a;
  if (a !== 1) {
    step('Divide both sides by '+a,logarithm+'='+exponent,'log_'+base+'('+argument+') = '+plainExponent);
  }
  const power = base+'^{'+exponent+'}';
  const plainPower = base+'^('+plainExponent+')';
  step('Rewrite in exponential form',argument+'='+power,argument+' = '+plainPower);
  if (c !== 1) step('Divide both sides by '+c,'x=\\frac{'+power+'}{'+c+'}','x = '+plainPower+'/'+c);
  const rounded = Math.abs(exact-answer) > Number.EPSILON*Math.max(1,Math.abs(exact));
  const displayed = rounded ? answer.toFixed(2) : String(answer);
  step('Final answer', 'x'+(rounded ? '\\approx ' : '=')+displayed,'x '+(rounded ? '≈' : '=')+' '+displayed);
  target.hidden = false;
  byId('show-solution').setAttribute('aria-expanded','true');
}

document.addEventListener('DOMContentLoaded', () => {
  const input = byId('answer');
  input.inputMode = 'decimal';
  byId('form').addEventListener('submit',event => {
    event.preventDefault();
    const [kind,message] = assess(input.value,current.answer);
    byId('feedback').className = 'feedback '+kind;
    byId('feedback').textContent = message;
  });
  byId('next').addEventListener('click',() => { newQuestion(); input.focus(); });
  byId('show-solution').addEventListener('click',showSolution);
  newQuestion();
});
</script>
</body>
</html>
