<body><main aria-label="Degrees and radians practice">
<a class="back-link" href="index.html">← Skill Builder</a>
<h1>Degrees and Radians</h1>
<p id="prompt" class="prompt"></p>
<div id="question" class="math"></div>
<form id="form"><div class="answer-row"><input id="answer" aria-label="Your answer including degrees or radians" aria-describedby="hint feedback" autocomplete="off" spellcheck="false" placeholder="Your answer"><div><span class="preview-label">Preview</span><div id="preview" class="preview empty" aria-label="Answer preview" aria-live="polite">Your formatted answer</div></div></div><div class="actions"><button type="submit">Check Answer</button><button type="button" id="next">New Question</button><button type="button" id="show-solution" aria-controls="solution" aria-expanded="false">Show Solution</button></div></form>
<p id="hint" class="hint"></p>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<div id="solution" class="solution" hidden></div>
<p id="render-status" class="hint" hidden></p>
</main><script>
'use strict';
const randomInt=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const angles=[0,15,30,45,60,75,90,105,120,135,150,165,180,210,225,240,270,300,315,330,360];
let directionBag=[],angleBag=[];
function shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=randomInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function gcd(a,b){a=Math.abs(a);while(b){[a,b]=[b,a%b];}return a;}
function piLatex(n,d=1){if(n===0)return '0';const coefficient=Math.abs(n)===1?'':String(Math.abs(n)),top=coefficient+'\\pi',sign=n<0?'-':'';return sign+(d===1?top:'\\frac{'+top+'}{'+d+'}');}
function piText(n,d=1){if(n===0)return '0';return (n===1?'':n===-1?'-':String(n))+'pi'+(d===1?'':'/'+d);}
function generateQuestion(){
  if(!directionBag.length)directionBag=shuffle(['toRadians','toDegrees']);
  if(!angleBag.length)angleBag=shuffle(angles);
  const direction=directionBag.pop(),degrees=angleBag.pop(),factor=gcd(degrees,180),n=degrees/factor,d=180/factor;
  return {direction,degrees,n,d,radians:degrees*Math.PI/180};
}
function parseAnswer(text){
  if(!text.trim())throw Error('Enter your answer, including degrees or radians.');
  if(text.length>100)throw Error('Keep your answer to 100 characters or fewer.');
  let s=text.trim().toLowerCase().replace(/[−–]/g,'-').replace(/π/g,'pi');
  const suffix=s.match(/\s*(radians?|rads?|degrees?|degs?|°|\^c)$/);let unit;
  if(suffix){unit=suffix[1].startsWith('rad')||suffix[1]==='^c'?'radians':'degrees';s=s.slice(0,suffix.index);}
  s=s.replace(/\s/g,'');
  let depth=0;for(const t of s){if(t==='(')depth++;if(t===')')depth--;if(depth<0)throw Error('Check your brackets.');}if(depth)throw Error('Check your brackets.');
  if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return {value:Number(s),unit,latex:s,exact:false};
  let bare=s;
  while(bare.startsWith('(')&&bare.endsWith(')')){
    let depth=0,whole=true;for(let i=0;i<bare.length-1;i++){if(bare[i]==='(')depth++;if(bare[i]===')')depth--;if(depth===0){whole=false;break;}}
    if(!whole)break;bare=bare.slice(1,-1);
  }
  bare=bare.replace(/^\(([+-]?\d*\*?pi)\)(?=\/|$)/,'$1').replace(/\/\((\d+)\)$/,'/$1').replace(/^\(([+-]?\d+\/\d+)\)(?=\*?pi$)/,'$1');
  let match=bare.match(/^([+-]?\d*)\*?pi(?:\/(\d+))?$/),n,d;
  if(match){n=match[1]===''||match[1]==='+'?1:match[1]==='-'?-1:Number(match[1]);d=Number(match[2]||1);}
  else{match=bare.match(/^([+-]?\d+)\/(\d+)\*?pi$/);if(match){n=Number(match[1]);d=Number(match[2]);}}
  if(!match)throw Error('Use a number, or a multiple of pi such as pi/3 or 2*pi/3, followed by radians or degrees.');
  if(d===0)throw Error('The denominator cannot be zero.');
  return {value:n*Math.PI/d,n,d,unit,latex:piLatex(n,d),exact:true};
}
function assessAnswer(q,text){
  let answer;try{answer=parseAnswer(text);}catch(error){return {kind:'input',text:'Check your input. '+error.message};}
  const expectedUnit=q.direction==='toRadians'?'radians':'degrees',expected=q.direction==='toRadians'?q.radians:q.degrees;
  if(q.direction==='toRadians'&&!answer.exact&&answer.value!==0)return {kind:'input',text:'An exact value is required. Use pi rather than a decimal, for example pi/3.'};
  const correct=q.direction==='toRadians'&&answer.exact?answer.n*q.d===q.n*answer.d:Math.abs(answer.value-Number(expected.toFixed(2)))<=0.01+1e-10;
  if(correct&&!answer.unit&&q.direction==='toDegrees')return {kind:'close',text:'You’re close! The value is correct. Include '+expectedUnit+' in your answer.'};
  if(answer.unit&&answer.unit!==expectedUnit)return {kind:'input',text:'Check your input. This question asks for '+expectedUnit+'. Include '+expectedUnit+' with your answer.'};
  if(correct&&q.direction==='toRadians'&&answer.exact&&gcd(answer.n,answer.d)!==1)return {kind:'close',text:'You’re close! Your answer is equivalent to the correct answer, but the fraction must be simplified to lowest terms.'};
  if(correct)return {kind:'good',text:'Correct!'};
  return {kind:'bad',text:q.direction==='toRadians'?'Not quite. To convert degrees to radians, multiply by pi/180 and simplify. Give an exact answer using pi.':'Not quite. To convert radians to degrees, multiply by 180/pi. The pi terms cancel.'};
}
function solutionSteps(q){
  if(q.direction==='toRadians')return [
    ['Use the conversion factor','To convert degrees to radians, multiply by this factor.','\\frac{\\pi}{180}'],
    ['Multiply','',`${q.degrees}^{\\circ}\\times\\frac{\\pi}{180}`],
    ['Simplify','Reduce the fraction to give an exact answer.',`\\frac{${q.degrees}\\pi}{180}=${piLatex(q.n,q.d)}\\,\\mathrm{radians}`]
  ];
  return [
    ['Use the conversion factor','To convert radians to degrees, multiply by this factor.','\\frac{180}{\\pi}'],
    ['Multiply','',`${piLatex(q.n,q.d)}\\times\\frac{180}{\\pi}`],
    ['Cancel the common factor and calculate','',`\\frac{${q.n}\\times180}{${q.d}}=${q.degrees}^{\\circ}`]
  ];
}
const $=id=>document.getElementById(id);
function renderMath(target,latex){if(window.katex)window.katex.render(latex,target,{throwOnError:false,output:'htmlAndMathml'});else target.textContent=latex;}
let current;
function updatePreview(){const target=$('preview');target.className='preview';if(!$('answer').value.trim()){target.textContent='Your formatted answer';target.className+=' empty';return;}try{const a=parseAnswer($('answer').value);renderMath(target,a.latex+(a.unit==='degrees'?'^{\\circ}':a.unit==='radians'?'\\,\\mathrm{radians}':''));}catch(error){target.textContent='Keep typing a number or an answer such as pi/3 radians.';target.className+=' empty';}}
function newQuestion(){
  current=generateQuestion();const toRadians=current.direction==='toRadians';
  $('prompt').textContent=toRadians?'Convert to radians. Give a simplified exact answer using pi.':'Convert to degrees. Include degrees in your answer.';
  renderMath($('question'),toRadians?`${current.degrees}^{\\circ}`:piLatex(current.n,current.d)+'\\,\\mathrm{radians}');
  $('hint').textContent=toRadians?'For example: pi/3.':'For example: 60 degrees.';
  $('answer').placeholder=toRadians?'For example: pi/3':'For example: 60 degrees';$('answer').value='';updatePreview();$('feedback').textContent='';$('feedback').className='feedback';$('solution').hidden=true;$('solution').textContent='';$('show-solution').setAttribute('aria-expanded','false');
}
function showSolution(){
  const target=$('solution');target.textContent='';for(const [heading,explanation,latex] of solutionSteps(current)){
    const row=document.createElement('div');row.className='step';const title=document.createElement('strong');title.textContent=heading;row.appendChild(title);if(explanation){const p=document.createElement('p');p.textContent=explanation;row.appendChild(p);}const maths=document.createElement('div');maths.className='step-maths';renderMath(maths,latex);row.appendChild(maths);target.appendChild(row);
  }
  const label=document.createElement('strong');label.className='final-label';label.textContent='Final answer:\u00a0\u00a0\u00a0';target.appendChild(label);
  const result=document.createElement('div');result.className='step-maths';renderMath(result,current.direction==='toRadians'?piLatex(current.n,current.d)+'\\,\\mathrm{radians}':`${current.degrees}^{\\circ}`);target.appendChild(result);target.hidden=false;$('show-solution').setAttribute('aria-expanded','true');
}
window.addEventListener('DOMContentLoaded',()=>{
  if(!window.katex){$('render-status').hidden=false;$('render-status').textContent='Connect to the internet and reload for maths formatting.';}
  $('form').addEventListener('submit',event=>{event.preventDefault();const verdict=assessAnswer(current,$('answer').value);$('feedback').textContent=verdict.text;$('feedback').className='feedback '+verdict.kind;});
  $('answer').addEventListener('input',updatePreview);$('next').addEventListener('click',()=>{newQuestion();$('answer').focus();});$('show-solution').addEventListener('click',showSolution);newQuestion();
});

</script></body></html>
