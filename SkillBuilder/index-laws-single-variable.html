.back-link:hover{text-decoration:underline}

.feedback:not(:empty){padding:10px 12px;border-radius:5px;border-left:3px solid currentColor}

<body><main aria-label="Index laws practice"><a class="back-link" href="index.html">← Skill Builder</a><h1>Index Laws - Single Variable</h1>
<p class="instructions">Enter your answer using ^ for powers (e.g. x^7) and / for fractions (e.g. 1/25).</p>
<p id="render-status" role="status" hidden></p>
<div id="questions"></div>
</main><script>
window.addEventListener("DOMContentLoaded", () => {
'use strict';

function displayFeedback(target,kind,text){
  const prefixes={bad:'Not quite. ',close:'You’re close! ',input:'Check your input. '};
  const prefix=prefixes[kind];
  if(prefix&&!text.startsWith(prefix.trim()))text=prefix+text;
  target.textContent=text;
  target.className='feedback '+kind;
}
function checkExpressionInput(source){
  if(!source.trim())throw Error('Enter your answer before checking it.');
  if(source.length>180)throw Error('Keep your answer to 180 characters or fewer.');
  const s=source.replace(/\s/g,'');
  if(s.startsWith('/'))throw Error('The fraction is missing its numerator. Enter a number or expression before /.');
  let depth=0;
  for(const character of s){if(character==='(')depth++;if(character===')')depth--;if(depth<0)throw Error('There is a closing bracket without an opening bracket. Check your brackets.');}
  if(/\/(?:\()?$/g.test(s))throw Error('The fraction is missing its denominator. Enter a number or expression after /, using brackets around a multi-term denominator.');
  if(/\^(?:\(?[+-]?)?$/.test(s))throw Error('The power is missing its exponent. Enter an integer after ^, for example x^3.');
  if(depth!==0)throw Error('An opening bracket is missing its closing bracket. Put the whole denominator inside matching brackets when entering a fraction.');
  if(/\*\*|\/\/|\^\^/.test(s))throw Error('Check the repeated operation signs. Use one * for multiplication, / for a fraction, or ^ for a power.');
}

function normaliseVariable(source,variable='x'){
  for(const letter of source.match(/[a-zA-Z]/g)||[]){
    if(letter!==variable)throw Error('Use '+variable+' as the variable for this question.');
  }
  return variable==='x'?source:source.replace(new RegExp(variable,'g'),'x');
}
function parseExpression(source,variable='x'){
  checkExpressionInput(source);
  source=normaliseVariable(source,variable);
  let s=source.replace(/\s/g,'').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3');
  if(!s || s.length>180)throw Error('Enter an expression of at most 180 characters.');
  let tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+)|[x()+*/^\-]/g)||[];
  if(tokens.join('')!==s)throw Error('Use '+variable+', numbers, brackets, +, -, *, / and ^.');
  let i=0;
  const value=(c,p=0)=>{if(!Number.isFinite(c)||!Number.isFinite(p)||Math.abs(p)>100||Math.abs(c)>1e100)throw Error('This expression is outside the supported range.');return {c,p:c===0?0:p};};
  function atom(){let t=tokens[i++];if(t==='('){let a=sum();if(tokens[i++]!==')')throw Error('Check your brackets.');return a;}if(t==='x')return value(1,1);if(t && /^(?:\d|\.)/.test(t))return value(Number(t));throw Error('Check the expression syntax.');}
  function power(){let a=atom();if(tokens[i]==='^'){i++;let b=unary();if(b.p!==0||!Number.isInteger(b.c)||Math.abs(b.c)>100)throw Error('Use integer numerical exponents between -100 and 100.');if(a.c===0&&b.c<=0)throw Error('That power is undefined.');a=value(a.c**b.c,a.p*b.c);}return a;}
  function unary(){if(tokens[i]==='+'){i++;return unary();}if(tokens[i]==='-'){i++;let a=unary();return value(-a.c,a.p);}return power();}
  function product(){let a=unary();while(i<tokens.length){let op=tokens[i];let implicit=op==='x'||op==='('||(op && /^(?:\d|\.)/.test(op));if(op!=='*'&&op!=='/'&&!implicit)break;if(!implicit)i++;let b=unary();if(op==='/'){if(b.c===0)throw Error('Division by zero is undefined.');a=value(a.c/b.c,a.p-b.p);}else a=value(a.c*b.c,a.p+b.p);}return a;}
  function sum(){let a=product();while(tokens[i]==='+'||tokens[i]==='-'){let op=tokens[i++],b=product();if(a.c!==0&&b.c!==0&&a.p!==b.p)throw Error('For this activity, enter a single power of x or an equivalent product or fraction.');a=value(a.c+(op==='+'?b.c:-b.c),a.c===0?b.p:a.p);}return a;}
  let result=sum();if(i!==tokens.length)throw Error('Check the expression syntax.');return result;
}

'use strict';
const randomInt=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const powerText=n=>n===0?'1':n===1?'x':`x^${n}`;
const powerLatex=n=>n===0?'1':n===1?'x':`x^{${n}}`;
function createQuestion(type){
  let a=randomInt(2,9), b=randomInt(2,5);
  switch(type){
    case 'multiply':return {latex:`x^{${a}} \\times x^{${b}}`,c:1,p:a+b,answer:powerText(a+b),solution:powerLatex(a+b),hint:'Add the exponents when multiplying powers of the same base.'};
    case 'divide':a=randomInt(3,12);b=randomInt(1,a-1);return {latex:`\\frac{x^{${a}}}{x^{${b}}}`,c:1,p:a-b,requireSimplified:true,answer:powerText(a-b),solution:powerLatex(a-b),hint:'Subtract the denominator’s exponent from the numerator’s exponent.'};
    case 'power':return {latex:`\\left(x^{${a}}\\right)^{${b}}`,c:1,p:a*b,answer:powerText(a*b),solution:powerLatex(a*b),hint:'Multiply the exponents when raising a power to another power.'};
    case 'zero':{const style=randomInt(0,2),base=randomInt(2,9);return {latex:style===0?'x^{0}':style===1?`${base}^{0}`:`\\left(-${base}\\right)^{0}`,numeric:style!==0,c:1,p:0,answer:'1',solution:'1',hint:'Any nonzero number raised to the power zero equals 1.'};}
    case 'negative':{let exponent=randomInt(2,3),base=randomInt(2,exponent===2?9:5),denominator=base**exponent;return {latex:`${base}^{-${exponent}}`,c:1/denominator,p:0,answer:`1/${denominator}`,solution:`\\frac{1}{${denominator}}`,fraction:true,hint:'Use the reciprocal, then evaluate the positive power in the denominator.'};}
    case 'root':return {latex:`\\sqrt{x^{${2*a}}}`,c:1,p:a,answer:powerText(a),solution:powerLatex(a),hint:'For positive x, halve the exponent when taking a square root.'};
    case 'fractional':{let degree=randomInt(2,3),root=randomInt(2,degree===2?10:5);return {latex:`${root**degree}^{\\frac{1}{${degree}}}`,c:root,p:0,answer:String(root),solution:String(root),hint:`A power of 1/${degree} means take the ${degree===2?'square':'cube'} root.`};}
    default:throw Error('Unknown question type');
  }
}

function generateQuestion(type){
  const q=createQuestion(type),numbers=q.latex.match(/\d+/g).map(Number),[a,b]=numbers;
  switch(type){
    case 'multiply':q.working=`Add the exponents: ${a} + ${b} = ${q.p}.`;break;
    case 'divide':q.working=`Subtract the exponents: ${a} − ${b} = ${q.p}.`;break;
    case 'power':q.working=`Multiply the exponents: ${a} × ${b} = ${q.p}.`;break;
    case 'zero':q.working='Any nonzero number raised to the power zero equals 1.';break;
    case 'negative':q.solutionSteps=q.latex+` = \\frac{1}{${a}^{${b}}} = `+q.solution;q.working='A negative exponent means take the reciprocal, then evaluate the positive power in the denominator.';break;
    case 'root':q.solutionSteps=`\\sqrt{x^{${a}}} = \\left(x^{${a}}\\right)^{\\frac{1}{2}} = x^{${a}\\times\\frac{1}{2}} = ${q.solution}`;q.working=`Write the square root as a power of 1/2, then multiply the powers: ${a} × 1/2 = ${q.p}.`;break;
    case 'fractional':{const degree=numbers[numbers.length-1];q.solutionSteps=q.latex+' = '+(degree===2?`\\sqrt{${a}}`:`\\sqrt[${degree}]{${a}}`)+' = '+q.solution;q.working=`A power of 1/${degree} means take the ${degree===2?'square':'cube'} root. ${q.answer} to the power ${degree} equals ${a}.`;break;}
  }
  q.type=type;
  q.rule={multiply:'Multiplying powers',divide:'Dividing powers',power:'Power of a power',zero:'Zero powers',negative:'Negative powers',root:'Roots and fractional powers',fractional:'Fractional powers and roots'}[type];
  q.calculation=type==='multiply'?`${a}+${b}=${q.p}`:type==='divide'?`${a}-${b}=${q.p}`:type==='power'?`${a}\\times ${b}=${q.p}`:type==='root'?`${a}\\times\\frac{1}{2}=${q.p}`:null;
  if(type==='negative')q.calculation=`${a}^{${b}}=${q.answer.slice(2)}`;
  if(type==='fractional')q.calculation=`${q.answer}^{${numbers[numbers.length-1]}}=${a}`;
  if(['multiply','divide','power','zero','root'].includes(type)&&!q.numeric){
    const letters='xyzabcdfghmnpqrstuvw';
    q.variable=letters[randomInt(0,letters.length-1)];
    for(const field of ['latex','solution','solutionSteps','working','hint']){
      if(q[field])q[field]=q[field].replace(/\bx\b/g,q.variable);
    }
  }
  return q;
}
// Format the student's expression without replacing it by its simplified value.
function expressionLatex(source,variable='x'){
  parseExpression(source,variable);
  source=normaliseVariable(source,variable);
  const s=source.replace(/\s/g,'').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3');
  const tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+)|[x()+*/^\-]/g);let i=0;
  function atom(){let t=tokens[i++];if(t==='('){let inside=sum();i++;return '\\left('+inside+'\\right)';}return t==='x'?variable:t;}
  function power(){let a=atom();if(tokens[i]==='^'){i++;a+='^{'+unary()+'}';}return a;}
  function unary(){if(tokens[i]==='+'||tokens[i]==='-')return tokens[i++]+unary();return power();}
  function product(){let a=unary();while(i<tokens.length){let op=tokens[i],implicit=op==='x'||op==='('||(op&&/^(?:\d|\.)/.test(op));if(op!=='*'&&op!=='/'&&!implicit)break;if(!implicit)i++;let b=unary();a=op==='/'?'\\frac{'+a+'}{'+b+'}':a+(implicit?'':' \\times ')+b;}return a;}
  function sum(){let a=product();while(tokens[i]==='+'||tokens[i]==='-'){let op=tokens[i++];a+=' '+op+' '+product();}return a;}
  return sum();
}
function assessAnswer(question,text){
  const result=parseExpression(text,question.variable);
  if(Math.abs(result.c-question.c)>1e-12||result.p!==question.p){
    let message;
    if(question.variable&&question.p!==0){
      const parts=[];
      if(Math.abs(result.c-1)>1e-12)parts.push('the coefficient');
      if(result.p!==question.p)parts.push('the power of '+question.variable);
      message='Check '+parts.join(' and ')+', then try again. '+question.hint;
    }else message=question.type==='negative'?'Check the reciprocal and the denominator calculation. '+question.hint:question.type==='fractional'?'Check your root calculation. '+question.hint:question.hint+' Check your answer and try again.';
    return {kind:'bad',text:'Not quite. '+message};
  }
  let compact=normaliseVariable(text,question.variable).replace(/\s/g,'').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\^\((\d+)\)/g,'^$1');
  function unwrap(t){while(t.startsWith('(')&&t.endsWith(')')){let depth=0,whole=true;for(let i=0;i<t.length-1;i++){if(t[i]==='(')depth++;if(t[i]===')')depth--;if(depth===0){whole=false;break;}}if(!whole)break;t=t.slice(1,-1);}return t;}
  compact=unwrap(compact);
  if(question.fraction){
    const pieces=compact.split('/');
    const simplified=pieces.length===2&&unwrap(pieces[0])==='1'&&unwrap(pieces[1])===question.answer.slice(2);
    if(!simplified)return {kind:'close',text:'You’re close! The value is correct. Write your answer as a simplified fraction with the denominator evaluated, using / between the numerator and denominator.'};
  }else if(question.p===0){
    if(!/^\d+(?:\.0+)?$/.test(compact))return {kind:'close',text:'You’re close! The value is correct. Evaluate it fully and enter a single number.'};
  }else if(compact!==question.answer){
    return {kind:'close',text:'You’re close! Your answer is equivalent to the correct answer. Check that your answer is fully simplified.'};
  }
  return {kind:'good',text:'Correct!'};
}
function renderMath(element,latex){
  latex=latex.replace(/([a-z])\^\{1\}/g,'$1');
  if(window.katex){window.katex.render(latex,element,{throwOnError:false,output:'htmlAndMathml'});}
  else{element.textContent=latex;element.classList.add('fallback');}
}
const titles={multiply:'Multiplying powers',divide:'Dividing powers',power:'Power of a power',zero:'Zero powers',negative:'Negative powers',root:'Square roots of powers',fractional:'Fractional powers'};
const rows=[
  ['multiply','Simplify.',''],
  ['divide','Simplify.','Assume x ≠ 0.'],
  ['power','Simplify.',''],
  ['zero','Evaluate.','Assume x ≠ 0.'],
  ['negative','Write as a fraction.',''],
  ['root','Simplify.','Assume x > 0.'],
  ['fractional','Evaluate.','']
];
if(!window.katex){const status=document.getElementById('render-status');status.hidden=false;status.textContent='Maths formatting could not load. Connect to the internet and reload the page.';}
for(const [index,[type,instruction,assumption]] of rows.entries()){
  const section=document.createElement('section');
  section.setAttribute('aria-label',`Question ${index+1}`);
  section.className=type;
  section.innerHTML=`<h2>${index+1}. ${titles[type]}</h2><p class="prompt">${instruction} ${assumption}</p><div class="math"></div><form><div class="answer-row"><input aria-label="Answer to question ${index+1}" aria-describedby="feedback-${index}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer"><div><span class="preview-label">Preview</span><div class="preview empty" aria-live="polite">Your formatted answer</div></div></div><div class="actions"><button type="submit">Check Answer</button><button type="button" class="next">New Question</button><button type="button" class="show-solution" aria-controls="solution-${index}" aria-expanded="false">Show Solution</button></div></form><div class="feedback" id="feedback-${index}" role="status" aria-live="polite"></div><div class="solution" id="solution-${index}" hidden><strong class="rule-heading"></strong><div class="solution-answer"></div><div class="working"></div><div class="calculation solution-answer"></div><strong class="final-heading">Final answer:&#160;&#160;&#160;</strong><div class="final-answer solution-answer"></div></div>`;
  document.getElementById('questions').appendChild(section);
  const input=section.querySelector('input'),feedback=section.querySelector('.feedback');
  const preview=section.querySelector('.preview'),solution=section.querySelector('.solution'),show=section.querySelector('.show-solution');
  function updatePreview(){
    preview.className='preview';
    if(!input.value.trim()){preview.textContent='Your formatted answer';preview.className+=' empty';return;}
    try{renderMath(preview,expressionLatex(input.value,question.variable));}
    catch(error){preview.textContent='Keep typing an expression, such as x^3 or 1/25.';preview.className+=' empty';}
  }
  let question;
  function next(){question=generateQuestion(type);section.querySelector('.prompt').textContent=instruction+' '+(question.numeric?'':assumption.replace(/\bx\b/g,question.variable||'x'));input.placeholder=question.variable?'For example: '+question.variable+'^3':'Your answer';renderMath(section.querySelector('.math'),question.latex);input.value='';feedback.textContent='';feedback.className='feedback';updatePreview();solution.hidden=true;show.setAttribute('aria-expanded','false');section.querySelector('.solution-answer').textContent='';section.querySelector('.working').textContent='';}
  section.querySelector('form').addEventListener('submit',event=>{
    event.preventDefault();
    try{const verdict=assessAnswer(question,input.value);displayFeedback(feedback,verdict.kind,verdict.text);if(verdict.solution){let math=document.createElement('span');feedback.appendChild(math);renderMath(math,question.solution);}}
    catch(error){displayFeedback(feedback,'input',error.message);}
  });
  input.addEventListener('input',updatePreview);
  section.querySelector('.next').addEventListener('click',()=>{next();input.focus();});
  show.addEventListener('click',()=>{
    section.querySelector('.rule-heading').textContent=question.rule;
    renderMath(section.querySelector('.solution-answer'),question.solutionSteps||(question.latex+' = '+question.solution));
    section.querySelector('.working').textContent=question.hint;
    const calculation=section.querySelector('.calculation');calculation.hidden=!question.calculation;
    if(question.calculation)renderMath(calculation,question.calculation);else calculation.textContent='';
    if(type==='root')section.querySelector('.working').textContent='A square root is a power of 1/2. Write it as a fractional power, then multiply the exponents.';
    if(type==='fractional')section.querySelector('.working').textContent=question.working;
    renderMath(section.querySelector('.final-answer'),question.solution);
    solution.hidden=false;show.setAttribute('aria-expanded','true');
  });
  next();
}

});
</script></body></html>
