<style>

<body><main aria-label="Log laws practice"><a class="back-link" href="index.html">← Skill Builder</a>
<h1>Log Laws</h1>
<p class="prompt">Evaluate. Enter a single integer. Try to complete these questions without a calculator.</p>
<div id="question" class="math"></div>
<form id="form"><input id="answer" aria-label="Your answer" aria-describedby="feedback" autocomplete="off" placeholder="Your answer"><div class="actions"><button type="submit">Check Answer</button><button type="button" id="next">New Question</button><button type="button" id="show-solution" aria-controls="solution" aria-expanded="false">Show Solution</button></div></form>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<div id="solution" class="solution" hidden></div>
<p id="render-status" class="hint" role="status" hidden></p>
</main><script>
'use strict';
const randomInt=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const powerLimits={2:6,3:4,4:3,5:3,10:3};
const bases=Object.keys(powerLimits).map(Number);
const log=(base,argument)=>`\\log_{${base}}\\left(${argument}\\right)`;
let typeBag=[],quotientBag=[],powerBag=[],powerBaseBag=[];
function shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=randomInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function isIntegerPower(base,value){
  if(!Number.isInteger(value)||value<1)return false;
  while(value>1&&value%base===0)value/=base;
  return value===1;
}
const productCases=[],differenceCases=[];
for(const base of [4,6,8,9,10,12])for(const answer of [1,2,3]){
  const target=base**answer;
  for(let M=2;M<=Math.sqrt(target);M++){
    if(target%M!==0)continue;
    const N=target/M;
    if(M<=10&&N<=10&&!isIntegerPower(base,M)&&!isIntegerPower(base,N))productCases.push({base,M,N,answer});
  }
}
for(const base of bases)for(let exponent=1;exponent<=powerLimits[base];exponent++)for(let factor=2;factor<=9;factor++){
  const M=factor*base**exponent,N=factor;
  if(M>(base===10?1000:125)||isIntegerPower(base,M)||isIntegerPower(base,N))continue;
  differenceCases.push({base,M,N,answer:exponent},{base,M:N,N:M,answer:-exponent});
}
function generateQuestion(forced,quotientForm){
  if(!typeBag.length)typeBag=shuffle(['product','quotient','power','base','one']);
  const type=forced||typeBag.pop();let base=bases[randomInt(0,bases.length-1)],limit=powerLimits[base];
  let m,n,M,N,p,form,answer,latex;
  if(type==='product'){
    const selected=productCases[randomInt(0,productCases.length-1)];({base,M,N,answer}=selected);if(Math.random()<0.5)[M,N]=[N,M];latex=log(base,M)+' + '+log(base,N);
  }else if(type==='quotient'){
    if(!quotientBag.length)quotientBag=shuffle(['difference','reciprocal']);form=quotientForm||quotientBag.pop();
    if(form==='reciprocal'){m=0;n=randomInt(1,limit);M=1;N=base**n;answer=-n;latex=log(base,`\\frac{1}{${N}}`);}
    else{({base,M,N,answer}=differenceCases[randomInt(0,differenceCases.length-1)]);latex=log(base,M)+' - '+log(base,N);}
  }else if(type==='power'){
    if(!powerBag.length)powerBag=shuffle([2,3,4,5]);p=powerBag.pop();
    if(!powerBaseBag.length)powerBaseBag=shuffle(['same','different']);const style=powerBaseBag.pop();
    const cases=[];for(const candidateBase of bases)for(let exponent=1;exponent<=powerLimits[candidateBase];exponent++){
      if(candidateBase**exponent<=10&&p*exponent<=10&&(style==='same'?exponent===1:exponent>1))cases.push({base:candidateBase,m:exponent});
    }
    ({base,m}=cases[randomInt(0,cases.length-1)]);M=base**m;answer=m*p;latex=log(base,`${M}^{${p}}`);
  }else if(type==='base'){answer=1;latex=log(base,base);}
  else{answer=0;latex=log(base,1);}
  return {type,form,base,m,n,M,N,p,answer,latex};
}
function assessAnswer(q,text){
  const s=text.trim().replace(/[−–]/g,'-');
  if(!s)return {kind:'input',text:'Check your input. Enter your answer as a single integer.'};
  if(s.length>50||!(/^[+-]?\d+$/.test(s)))return {kind:'input',text:'Check your input. Evaluate fully and enter a single integer, rather than a logarithm or an expression. Use - for a negative answer.'};
  const answer=Number(s);if(answer===q.answer)return {kind:'good',text:'Correct!'};
  if(q.answer<0&&answer===-q.answer)return {kind:'bad',text:'Not quite. Check the sign. With these bases, the logarithm of a number between 0 and 1 is negative.'};
  const hints={
    product:'Adding logarithms with the same base means multiplying their arguments. Then find the power of the base that gives that number.',
    quotient:q.form==='reciprocal'?'Use the second log law to split the fraction into a subtraction. Evaluate each logarithm, then subtract.':'Subtracting logarithms with the same base means dividing their arguments. Check the order of the division and the sign of your answer.',
    power:'Bring the power in front of the logarithm as a multiplier. Evaluate the logarithm, then multiply.',
    base:'Think about what power the base must be raised to in order to give the base itself.',
    one:'Think about what power a nonzero number must be raised to in order to give 1.'
  };
  return {kind:'bad',text:'Not quite. '+hints[q.type]};
}
function solutionSteps(q){
  const {base,m,n,M,N,p}=q,steps=[];
  if(q.type==='product'){
    steps.push(['Use the first log law','Add logarithms by multiplying the arguments.',`${q.latex}=${log(base,`${M}\\times ${N}`)}`]);
    steps.push(['Multiply the arguments','',`${log(base,`${M}\\times ${N}`)}=${log(base,M*N)}`]);
    steps.push(['Identify the power','A logarithm asks for the power of the base.',`${base}^{${q.answer}}=${M*N}\\quad\\Rightarrow\\quad ${log(base,M*N)}=${q.answer}`]);
  }else if(q.type==='quotient'&&q.form==='reciprocal'){
    steps.push(['Use the second log law','Split the fraction into the logarithm of the numerator minus the logarithm of the denominator.',`${q.latex}=${log(base,1)}-${log(base,N)}`]);
    steps.push(['Evaluate the logarithms','Use the zero power and the power that gives the denominator.',`${base}^0=1\\quad\\text{and}\\quad ${base}^{${n}}=${N}`]);
    steps.push(['Subtract','',`${log(base,1)}-${log(base,N)}=0-${n}=${q.answer}`]);
  }else if(q.type==='quotient'){
    const argument=q.answer>=0?String(base**q.answer):`\\frac{1}{${base**(-q.answer)}}`;
    steps.push(['Use the second log law','Subtract logarithms by dividing their arguments.',`${q.latex}=${log(base,`\\frac{${M}}{${N}}`)}`]);
    steps.push(['Simplify the argument','',`${log(base,`\\frac{${M}}{${N}}`)}=${log(base,argument)}`]);
    if(q.answer<0){
      const denominator=base**(-q.answer);
      steps.push(['Use the second log law again','Split the fraction into a subtraction, then evaluate the logarithms.',`${log(base,argument)}=${log(base,1)}-${log(base,denominator)}=0-${-q.answer}=${q.answer}`]);
    }else steps.push(['Identify the power','',`${base}^{${q.answer}}=${argument}\\quad\\Rightarrow\\quad ${log(base,argument)}=${q.answer}`]);
  }else if(q.type==='power'){
    steps.push(['Use the third log law','Bring the power in front as a multiplier.',`${q.latex}=${p}\\times ${log(base,M)}`]);
    steps.push(['Evaluate the logarithm','',`${base}^{${m}}=${M}\\quad\\Rightarrow\\quad ${log(base,M)}=${m}`]);
    steps.push(['Multiply','',`${p}\\times ${m}=${q.answer}`]);
  }else if(q.type==='base'){
    steps.push(['Use the power of 1','Any number raised to the power 1 is itself.',`${base}^1=${base}`]);
    steps.push(['Evaluate','The logarithm is the required power.',`${q.latex}=1`]);
  }else{
    steps.push(['Use the zero power','Any nonzero number raised to the power 0 equals 1.',`${base}^0=1`]);
    steps.push(['Evaluate','The logarithm is the required power.',`${q.latex}=0`]);
  }
  return steps;
}
const $=id=>document.getElementById(id);
function renderMath(target,latex){if(window.katex)window.katex.render(latex,target,{throwOnError:false,output:'htmlAndMathml'});else target.textContent=latex;}
let current;
function newQuestion(){current=generateQuestion();renderMath($('question'),current.latex);$('answer').value='';$('feedback').textContent='';$('feedback').className='feedback';$('solution').hidden=true;$('solution').textContent='';$('show-solution').setAttribute('aria-expanded','false');}
function showSolution(){
  const target=$('solution');target.textContent='';
  for(const [heading,explanation,latex] of solutionSteps(current)){
    const row=document.createElement('div');row.className='step';const title=document.createElement('strong');title.textContent=heading;row.appendChild(title);
    if(explanation){const p=document.createElement('p');p.textContent=explanation;row.appendChild(p);}
    const maths=document.createElement('div');maths.className='step-maths';renderMath(maths,latex);row.appendChild(maths);target.appendChild(row);
  }
  const label=document.createElement('strong');label.className='final-label';label.textContent='Final answer:\u00a0\u00a0\u00a0';target.appendChild(label);
  const answer=document.createElement('div');answer.className='step-maths';renderMath(answer,String(current.answer));target.appendChild(answer);target.hidden=false;$('show-solution').setAttribute('aria-expanded','true');
}
window.addEventListener('DOMContentLoaded',()=>{
  if(!window.katex){$('render-status').hidden=false;$('render-status').textContent='Connect to the internet and reload for maths formatting.';}
  $('form').addEventListener('submit',event=>{event.preventDefault();const verdict=assessAnswer(current,$('answer').value);$('feedback').textContent=verdict.text;$('feedback').className='feedback '+verdict.kind;});
  $('next').addEventListener('click',()=>{newQuestion();$('answer').focus();});$('show-solution').addEventListener('click',showSolution);newQuestion();
});

</script></body></html>
